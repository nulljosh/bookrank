name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No package.json, so nothing to install — node's own runner finds *.test.js itself.
      - run: node --test

  swift:
    # The apps' pure rules (ios/Tests), then a few UI walks over the screenshot shelf, on the same iPhone the
    # screenshots and local walks use (17 Pro Max), so a narrower phone's toolbar does not change what they find.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Unit tests
        run: |
          set -o pipefail
          cd ios && xcodegen
          xcodebuild test -project Kernel.xcodeproj -scheme Kernel -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' -only-testing:KernelTests CODE_SIGNING_ALLOWED=NO | tail -40
      - name: UI walks
        # The silent screenshot shelf only: no sign-in, never presses Listen.
        run: |
          set -o pipefail
          cd ios
          xcodebuild test -project Kernel.xcodeproj -scheme Kernel -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' CODE_SIGNING_ALLOWED=NO -resultBundlePath walks.xcresult \
            -only-testing:KernelUITests/LibraryWalk/testSearch -only-testing:KernelUITests/LibraryWalk/testSortFilter \
            -only-testing:KernelUITests/LibraryWalk/testCommandPalette -only-testing:KernelUITests/LibraryWalk/testAccountSections \
            -only-testing:KernelUITests/LibraryWalk/testSleepNote | tail -40
      - name: Keep the walk results when they fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: walks-xcresult
          path: ios/walks.xcresult
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: README file references aren't stale
        run: |
          python3 - <<'PY'
          import re, os, sys
          refs = re.findall(r'(?:src="|\]\()([^")#?\s]+)', open("README.md").read())
          bad = [r for r in refs if "://" not in r and not r.startswith(("mailto:", "/")) and not os.path.exists(r)]
          print("stale README refs:", bad)
          sys.exit(bool(bad))
          PY
