<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450"><style>
  :root { --ink: #1d1d1f; --muted: #6e6e73; --line: #c7c7cc; --box: #f5f5f7; --gold: #a56200; --goldbox: #fbf3e6; --bg: #ffffff; }
