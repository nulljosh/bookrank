name: Bookrank
packages:
  # healstack's pin, not litigate's stale `supabase-community` URL. Resolves to the
  # same 2.48.0 every sibling app is already on.
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.5.1"
options:
  bundleIdPrefix: com.heyitsmejosh
targets:
  Bookrank:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Bookrank]
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Bookrank/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Bookrank
        CFBundleName: Bookrank
        # NOTE: xcodegen ignores CFBundleVersion / CFBundleShortVersionString /
        # UISupportedInterfaceOrientations~ipad if set here — it rewrites Info.plist
        # with its own defaults. Those keys are patched by scripts/prepare-plist.py
        # AFTER `xcodegen generate` and BEFORE archiving.
        # See "Build gotchas" in ../roadmap.md.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.spine
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QMM486NPYC
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Without an entitlements file the signed bundle carries no
        # application-identifier while the embedded profile does — Apple rejects
        # that combination for TestFlight with ITMS-90886 (builds 1-3 all hit it).
        # Hand-committed rather than generated via xcodegen `entitlements.properties`,
        # since xcodegen already silently drops keys in this project (see prepare-plist.py).
        CODE_SIGN_ENTITLEMENTS: Bookrank/Bookrank.entitlements
  BookrankUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.spine.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QMM486NPYC
    dependencies:
      - target: Bookrank
  BookrankMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Bookrank]
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Bookrank/Info.plist
      properties:
        UILaunchScreen: {}
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDisplayName: Bookrank
        CFBundleName: Bookrank
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.spine
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QMM486NPYC
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Hand-committed rather than generated via the xcodegen `entitlements:`
        # block, for the same reason as the iOS target above: xcodegen silently
        # drops keys in this project. The generated block only ever emitted
        # app-sandbox, so the Mac bundle shipped without an application-identifier.
        # macOS uses the com.apple.-prefixed key; iOS uses the bare one.
        CODE_SIGN_ENTITLEMENTS: Bookrank/BookrankMac.entitlements
schemes:
  Bookrank:
    build:
      targets:
        Bookrank: all
        BookrankUITests: [test]
    test:
      targets: [BookrankUITests]
    shared: true
  BookrankMac:
    build:
      targets:
        BookrankMac: all
    shared: true
