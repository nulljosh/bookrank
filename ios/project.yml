name: Kernel
options:
  bundleIdPrefix: com.heyitsmejosh
targets:
  Kernel:
    type: application
    dependencies:
      - target: KernelWidgets   # the Home Screen widgets, embedded
      - target: KernelShare   # Share to Kernel from Safari and other apps
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Kernel
      - Widgets/WidgetFeed.swift
      - Widgets/ListenActivity.swift
      - Widgets/ToggleIntent.swift
      - Widgets/Inbox.swift
      - Widgets/ShareView.swift
      - ../Kernel.icon
      - path: ../goodreads-parse.js
        buildPhase: resources
      - path: ../fonts
        includes: ["*.otf", "*.ttf"]
        buildPhase: resources
    info:
      path: Kernel/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Kernel
        CFBundleName: Kernel
        NSFaceIDUsageDescription: Sign in faster with Face ID.
        NSCameraUsageDescription: Scan book pages into a chapter. The pages are read and dropped, never kept.
        NSUserActivityTypes: [com.heyitsmejosh.spine.reading]
        UIApplicationSceneManifest:   # iPad Stage Manager and Split View: more than one window; and the CarPlay scene
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - { UISceneClassName: CPTemplateApplicationScene, UISceneConfigurationName: CarPlay, UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlayScene }
        CFBundleURLTypes: [{ CFBundleURLName: com.heyitsmejosh.spine, CFBundleURLSchemes: [kernel] }]   # kernel://book/<slug>, from the widgets
        NSSupportsLiveActivities: true   # the Lock Screen and Dynamic Island while listening
        ITSAppUsesNonExemptEncryption: false   # HTTPS only; without this every build needs the compliance flag set by hand
        # NOTE: xcodegen ignores CFBundleVersion / CFBundleShortVersionString /
        # UISupportedInterfaceOrientations~ipad if set here — it rewrites Info.plist
        # with its own defaults. Those keys are patched by scripts/prepare-plist.py
        # AFTER `xcodegen generate` and BEFORE archiving.
        # See "Build gotchas" in ../roadmap.md.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.spine
        MARKETING_VERSION: "19.3.1"
        CURRENT_PROJECT_VERSION: "202610301628"
        ASSETCATALOG_COMPILER_APPICON_NAME: Kernel
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QMM486NPYC
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Without an entitlements file the signed bundle carries no
        # application-identifier while the embedded profile does — Apple rejects
        # that combination for TestFlight with ITMS-90886 (builds 1-3 all hit it).
        # Hand-committed rather than generated via xcodegen `entitlements.properties`,
        # since xcodegen already silently drops keys in this project (see prepare-plist.py).
        CODE_SIGN_ENTITLEMENTS: Kernel/Kernel.entitlements
  KernelUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.spine.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QMM486NPYC
    dependencies:
      - target: Kernel
  KernelWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Widgets]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Kernel
        NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.spine.widgets
        MARKETING_VERSION: "19.3.1"
        CURRENT_PROJECT_VERSION: "202610301628"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_ENTITLEMENTS: Widgets/KernelWidgets.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"   # the shared intent runs in the app, not here
  KernelShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Share, Widgets/Inbox.swift, Widgets/WidgetFeed.swift, Widgets/ShareView.swift, Kernel/Localizable.xcstrings]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Kernel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: { NSExtensionActivationSupportsText: true, NSExtensionActivationSupportsWebURLWithMaxCount: 1 }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.spine.share
        MARKETING_VERSION: "19.3.1"
        CURRENT_PROJECT_VERSION: "202610301628"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_ENTITLEMENTS: Share/KernelShare.entitlements
  KernelTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.spine.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QMM486NPYC
    dependencies:
      - target: Kernel
  KernelMacWidgets:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Widgets/WidgetFeed.swift, Widgets/KernelWidgets.swift, Widgets/ToggleIntent.swift]
    info:
      path: Widgets/Mac-Info.plist
      properties:
        CFBundleDisplayName: Kernel
        NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.spine.widgets
        MARKETING_VERSION: "19.3.1"
        CURRENT_PROJECT_VERSION: "202610301628"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_ENTITLEMENTS: Widgets/KernelMacWidgets.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
  KernelMac:
    type: application
    platform: macOS
    dependencies:
      - target: KernelMacWidgets   # Continue and the week on the Mac desktop, and the Control Center control
    deploymentTarget: "14.0"
    sources:
      - Kernel
      - Widgets/WidgetFeed.swift
      - Widgets/ToggleIntent.swift
      - Widgets/Inbox.swift
      - ../Kernel.icon
      - path: ../goodreads-parse.js
        buildPhase: resources
      - path: ../fonts
        includes: ["*.otf", "*.ttf"]
        buildPhase: resources
    info:
      path: Kernel/Info.plist
      properties:
        UILaunchScreen: {}
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDisplayName: Kernel
        CFBundleName: Kernel
        NSFaceIDUsageDescription: Sign in faster with Touch ID.
        NSUserActivityTypes: [com.heyitsmejosh.spine.reading]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.spine
        MARKETING_VERSION: "19.3.1"
        CURRENT_PROJECT_VERSION: "202610301628"
        ASSETCATALOG_COMPILER_APPICON_NAME: Kernel
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QMM486NPYC
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Hand-committed rather than generated via the xcodegen `entitlements:`
        # block, for the same reason as the iOS target above: xcodegen silently
        # drops keys in this project. The generated block only ever emitted
        # app-sandbox, so the Mac bundle shipped without an application-identifier.
        # macOS uses the com.apple.-prefixed key; iOS uses the bare one.
        CODE_SIGN_ENTITLEMENTS: Kernel/KernelMac.entitlements
  KernelWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [KernelWatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.spine.watchkitapp
        MARKETING_VERSION: "19.3.1"
        CURRENT_PROJECT_VERSION: "202610301628"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kernel
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.heyitsmejosh.spine
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QMM486NPYC
        SKIP_INSTALL: YES
schemes:
  KernelWatch:
    build:
      targets:
        KernelWatch: all
    shared: true
  Kernel:
    build:
      targets:
        Kernel: all
        KernelUITests: [test]
        KernelTests: [test]
    test:
      targets: [KernelTests, KernelUITests]
    shared: true
  Kernel:
    build:
      targets:
        Kernel: all
        KernelUITests: [test]
        KernelTests: [test]
    test:
      targets: [KernelTests, KernelUITests]
    shared: true
  KernelMac:
    build:
      targets:
        KernelMac: all
    shared: true
