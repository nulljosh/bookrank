<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>My summaries, Kernel</title>
<link rel="stylesheet" href="tokens.css">
<style>
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font-body); background:var(--bg); color:var(--text); line-height:1.6; -webkit-font-smoothing:antialiased; }
.wrap { max-width:820px; margin:0 auto; padding:clamp(2rem,6vw,4rem) 1.5rem 6rem; }
h1 { font-family:var(--font-display); font-size:1.75rem; letter-spacing:-0.02em; margin-bottom:0.25rem; }
.sub { color:var(--text3); font-size:0.875rem; margin-bottom:2rem; }
.bar { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1.5rem; }
button, .btn { font:inherit; font-size:0.875rem; padding:0.5rem 0.9rem; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg2); color:var(--text); cursor:pointer; text-decoration:none; }
button.primary { background:var(--accent); border-color: var(--link, var(--accent)); color:var(--bg); font-weight:500; }
button:disabled { opacity:0.5; cursor:default; }
input, textarea { font:inherit; width:100%; padding:0.55rem 0.75rem; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg2); color:var(--text); }
textarea { min-height:60vh; resize:vertical; line-height:1.6; }
.gate { max-width:360px; margin:clamp(1rem,7vh,4rem) auto 0; text-align:center; }
.gate-icon { width:72px; height:72px; border-radius:18px; margin:0 auto 1.5rem; display:block; }
.gate h1 { font-size:clamp(1.75rem,6vw,2.25rem); font-weight:600; letter-spacing:-0.035em; line-height:1.1; margin-bottom:0.5rem; }
.gate .sub { margin-bottom:1.75rem; }
form.auth { display:grid; gap:0.65rem; text-align:left; }
form.auth input { padding:0.7rem 0.9rem; font-size:1rem; border-radius:12px; }
form.auth button.oauth { width:100%; padding:0.7rem 1rem; font-size:0.9375rem; border-radius:999px; text-align:center; }
form.auth button.oauth.apple { background:#fafafa; color:#0a0a0a; border-color:#fafafa; font-weight:500; }
button.pill { background:var(--accent); color:var(--bg); border:0; font-weight:600; border-radius:999px; padding:0.75rem 1.5rem; font-size:1rem; margin-top:0.25rem; transition:transform .15s ease, opacity .15s ease; }
button.pill:hover { transform:translateY(-1px); opacity:.92; }
@media (prefers-reduced-motion:reduce) { button.pill { transition:none; } button.pill:hover { transform:none; } }
.or { display:flex; align-items:center; gap:0.75rem; color:var(--text3); font-size:0.8125rem; margin:0.35rem 0; }
.or::before,.or::after { content:""; flex:1; height:1px; background:var(--border2); }
.links { display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-top:0.25rem; }
button.link { background:none; border:0; padding:0.25rem 0; color:var(--text3); font-size:0.8125rem; text-decoration:underline; text-underline-offset:3px; }
button.link:hover { color:var(--text); }
.gate .msg { text-align:center; }
.row { display:flex; gap:0.5rem; }
ul.list { list-style:none; }
ul.list li { border-bottom:1px solid var(--border2); display:flex; align-items:center; gap:0.75rem; }
ul.list a { flex:1; min-width:0; display:flex; justify-content:space-between; gap:1rem; padding:0.85rem 0; color:var(--text); text-decoration:none; font-size:0.9375rem; }
ul.list img.thumb, ul.list .thumb-empty { width:2.25rem; height:3.25rem; object-fit:cover; border-radius:3px; background:var(--border2); flex:none; }
details.gr { margin-top:1.5rem; }
details.gr .by { display:block; }
details.gr summary { cursor:pointer; font-size:0.75rem; letter-spacing:0.04em; text-transform:uppercase; color:var(--text3); padding:0.4rem 0; }
ul.list li .by { color:var(--text3); font-size:0.8125rem; }
#find { width:100%; margin:0.25rem 0 0.75rem; padding:0.7rem 0.9rem; border:1px solid var(--border2); border-radius:var(--radius-sm); background:var(--bg2); color:var(--text); font:inherit; }
ul.list li.group { display:block; border:0; padding:1.5rem 0 0.4rem; font-size:0.75rem; letter-spacing:0.04em; text-transform:uppercase; color:var(--text3); }
ul.list .resume { color:var(--text3); font-size:0.75rem; margin-left:0.5rem; }
ul.list .listen { flex:none; font-size:0.8125rem; padding:0.3rem 0.6rem; }
ul.list a:hover { color: var(--link, var(--accent)); }
ul.list time { color:var(--text3); font-size:0.8125rem; white-space:nowrap; }
.ask { display:flex; gap:8px; margin:24px 0 8px; } .ask input { flex:1; } .ask button { flex:none; }
.answer { font-size:0.9375rem; line-height:1.5; color:var(--text2); margin:0 0 16px; }
.answer:empty { display:none; }
.msg { font-size:0.8125rem; color:var(--text3); min-height:1.2em; }
.hide { display:none !important; }   /* beats `ul.list li { display:flex }`, which silently kept filtered rows visible */
a.back { font-size:0.8125rem; color:var(--text3); text-decoration:none; }
a.skip { position:absolute; left:-9999px; }
a.skip:focus { left:1rem; top:1rem; position:fixed; z-index:9; padding:0.5rem 0.9rem; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
/* listen view (built by listen.js) */
.lp-bar { position:fixed; top:0; left:0; right:0; height:3px; background:transparent; z-index:5; }
.lp-fill { height:100%; width:0; background:var(--accent); transition:width 0.4s; }
.lp-controls { display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; margin-bottom:1.25rem; }
.lp-controls select { font:inherit; font-size:0.8125rem; padding:0.4rem 0.5rem; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg2); color:var(--text); max-width:11rem; }
.lp-controls .lp-status { flex-basis:100%; }
.lp-body { display:grid; grid-template-columns:12rem minmax(0,1fr); gap:2rem; align-items:start; }
.lp-toc { position:sticky; top:1.5rem; max-height:calc(100vh - 3rem); overflow:auto; font-size:0.8125rem; }
.lp-toc ol { list-style:none; counter-reset:ch; }
.lp-toc li { counter-increment:ch; }
.lp-toc a { display:block; padding:0.35rem 0.5rem; border-radius:var(--radius-sm); color:var(--text2); text-decoration:none; }
.lp-toc a::before { content:counter(ch) "  "; color:var(--text3); }
.lp-toc a:hover { color:var(--text); background:var(--bg2); }
.lp-toc small { color:var(--text3); font-size:.85em; white-space:nowrap; }
.lp-text > div.marked { box-shadow: inset 3px 0 0 var(--accent); }
.lp-toc .lp-marks a::before { content:none; }
.lp-toc .lp-marks a { padding:6px 0; border-radius:0; background:none; }
.lp-marks h4 { font-size:13px; font-weight:600; color:var(--text2); margin:24px 0 8px; }
.lp-marks a { display:block; font-size:13px; color:var(--text2); padding:6px 0; border-top:1px solid var(--border); text-decoration:none; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.lp-toc a.on { color:var(--text); background:var(--bg2); font-weight:500; }
.lp-text > div { margin-bottom:0.9rem; padding:0.3rem 0.6rem; margin-left:-0.6rem; margin-right:-0.6rem; border-radius:var(--radius-sm); color:var(--text2); cursor:pointer; scroll-margin:40vh; }
.lp-text > div b { color:var(--text3); font-weight:500; margin-right:0.25rem; }
.lp-text > div.on { background:var(--bg2); color:var(--text); }
.lp-text mark { background:var(--accent); color:var(--bg); border-radius:2px; padding:0 0.1em; }
.lp-text > div > :last-child, .lp-text > div > ul, .lp-text > div > ol { margin:0; }
.lp-text > div ul, .lp-text > div ol { padding-left:1.2rem; }
.lp-text > div h1, .lp-text > div h2, .lp-text > div h3 { font-family:var(--font-display); font-size:1.05rem; color:var(--text); }
.lp-text .lp-loading { color:var(--text3); cursor:default; }
@media (max-width:700px) { .lp-body { grid-template-columns:1fr; } .lp-toc { position:static; max-height:none; } .lp-toc ol { display:flex; flex-wrap:wrap; gap:0.25rem; } }
dl.profile { display:grid; grid-template-columns:auto 1fr; gap:0.5rem 1.5rem; font-size:0.9375rem; margin-bottom:2rem; }
dl.profile dt { color:var(--text3); }
</style>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#5B9BD5">

<body>
<a class="skip" href="#main">Skip to content</a>
<main class="wrap" id="main">
  <a class="back" href="/">&larr; Kernel</a>

  <!-- signed out -->
  <section id="gate" class="hide gate">
    <img class="gate-icon" src="icon.svg" width="72" height="72" alt="">
    <h1 id="gateTitle">Sign in to Kernel</h1>
    <p class="sub" id="gateSub">Your chapter summaries. Private to your account.</p>
    <form class="auth" id="authForm">
      <input type="email" id="email" placeholder="Email" aria-label="Email" autocomplete="email" required>
      <input type="password" id="password" placeholder="Password" aria-label="Password" autocomplete="current-password" minlength="8" required>
      <button class="pill" type="submit" id="submitBtn">Sign in</button>
      <p class="msg" id="authMsg" role="status" aria-live="polite"></p>
      <div class="links">
        <button type="button" class="link" id="forgot">Forgot password?</button>
        <button type="button" class="link" id="authToggle">New here? Create an account</button>
      </div>
    </form>
  </section>

  <!-- list -->
  <section id="listView" class="hide">
    <div class="bar">
      <div><h1>My summaries</h1><p class="sub" id="who"></p></div>
      <div class="row">
        <button class="primary" id="new">New summary</button>
        <a class="btn" id="profileBtn" href="profile.html">Profile</a>
        <button id="signout">Sign out</button>
      </div>
    </div>
    <input type="search" id="find" class="hide" placeholder="Search your summaries" aria-label="Search your summaries" autocomplete="off">
    <ul class="list" id="list"></ul>
    <p class="msg" id="listMsg"></p>
  </section>

  <!-- editor / listen -->
  <section id="editView" class="hide">
    <div class="bar">
      <input id="title" placeholder="Book title" aria-label="Book title">
      <div class="row">
        <button id="toggle">Edit</button>
        <button id="fromPhotos">From screenshots</button>
        <input type="file" id="photos" accept="image/*" multiple hidden>
        <button id="share">Share</button>
        <button class="primary" id="save">Save</button>
        <button id="del">Delete</button>
        <button id="close">Close</button>
      </div>
    </div>
    <div id="listen"></div>
    <form id="ask" class="ask hide"><input id="askQ" maxlength="500" placeholder="Ask this chapter a question" aria-label="Ask this chapter a question"><button class="primary">Ask</button></form>
    <p id="askA" class="answer" aria-live="polite"></p>
    <p id="unlock" hidden style="font-size:14px;color:var(--muted,#8a8a8a);margin:12px 0">Natural voices are $1 on the web. Your device voice is playing. <button type="button" onclick="unlockVoices()">Unlock for $1</button></p>
    <textarea id="body" class="hide" placeholder="Chapter summaries, in markdown…" aria-label="Chapter summaries"></textarea>
    <p class="msg" id="editMsg"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.7/purify.min.js" integrity="sha384-XQqX/4yiUGu+oyr87jvWzRuqBUK/adrY0DunhL+tID9m/9dwSpV8h9Fk/Sg6ifVQ" crossorigin="anonymous"></script>
<script type="module">
import { createClient } from './spark.js';
import { mount, matchCover, shareUrl, coverCandidates, chapters } from './listen.js';

const db = createClient('https://api.jaybulb.com');
const TABLE = 'bookrank_summaries';
const $ = id => document.getElementById(id);
const show = (...ids) => ['gate','listView','editView'].forEach(s => $(s).classList.toggle('hide', !ids.includes(s)));
const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'untitled';

let current = null; // row being edited

// ---- auth ----
let signingUp = false;
function setMode(up) {
  signingUp = up;
  $('gateTitle').textContent = up ? 'Create your account' : 'Sign in to Kernel';
  $('gateSub').textContent = up ? 'Chapter summaries of the books you read, in one private place.' : 'Your chapter summaries. Private to your account.';
  $('submitBtn').textContent = up ? 'Create account' : 'Sign in';
  $("authToggle").textContent = up ? 'Have an account? Sign in' : 'New here? Create an account';
  $('password').autocomplete = up ? 'new-password' : 'current-password';
  $('password').setAttribute('aria-label', up ? 'New password, 8 characters or more' : 'Password');
  $('password').placeholder = up ? 'Password, 8 characters or more' : 'Password';
  $('authMsg').textContent = '';
}
$("authToggle").onclick = () => setMode(!signingUp);
$('authForm').onsubmit = async e => {
  e.preventDefault();
  const creds = { email: $('email').value, password: $('password').value };
  if (!signingUp) {
    const { error } = await db.auth.signInWithPassword(creds);
    if (error) $('authMsg').textContent = error.message;
    return;
  }
  const { data, error } = await db.auth.signUp(creds);
  $('authMsg').textContent = error ? error.message
    : 'Check your email to confirm your account, then sign in.';
};
$('forgot').onclick = async () => {
  const email = $('email').value.trim();
  if (!email) { $('authMsg').textContent = 'Enter your email first.'; return; }
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  $('authMsg').textContent = error ? error.message : 'Reset link sent. Check your email.';
};
$('signout').onclick = async () => { try { await caches.delete('bookrank-data'); } catch {} db.auth.signOut(); };

// The client re-fires SIGNED_IN / TOKEN_REFRESHED on every tab focus and hourly token
// refresh. Rebuilding the list on those is what stopped playback and "clicked back" to the
// list by itself, so only a real sign-in or sign-out changes the screen.
// A reset link lands here with ?recovery_token=...; the client announces it and we ask for the new password.
function showRecovery() {
  const o = document.createElement('div');
  o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:99';
  o.innerHTML = '<form class="auth" style="background:Canvas;color:CanvasText;padding:1.5rem;border-radius:16px;display:grid;gap:.75rem;width:min(92vw,340px)"><strong>Choose a new password</strong><input type="password" minlength="8" required placeholder="New password, 8 characters or more" aria-label="New password" autocomplete="new-password"><button class="pill" type="submit">Save password</button><p class="msg" role="status" aria-live="polite"></p></form>';
  o.querySelector('form').onsubmit = async e => {
    e.preventDefault();
    const { error } = await db.auth.updateUser({ password: e.target.querySelector('input').value });
    if (error) { e.target.querySelector('.msg').textContent = error.message; return; }
    o.remove(); location.reload();
  };
  document.body.appendChild(o);
}
let signedIn = null;
db.auth.onAuthStateChange((_e, session) => {
  if (_e === 'PASSWORD_RECOVERY') { showRecovery(); return; }
  if (!!session === signedIn) return;
  signedIn = !!session;
  if (session) { $('who').textContent = session.user.email; show('listView'); load(); if (location.hash.length > 1) open(location.hash.slice(1)); }
  else { show('gate'); }
});

// ---- summarize from photos ----
// Photos never touch the database or localStorage: each one is posted straight to the API,
// the model's summary comes back, and the file is dropped. Only the text is kept.
$('fromPhotos').onclick = () => { render(false); $('photos').click(); };
$('photos').onchange = async () => {
  const files = [...$('photos').files];
  $('photos').value = '';
  if (!files.length) return;
  const { data: { session } } = await db.auth.getSession();
  const btn = $('fromPhotos');
  const label = btn.textContent;
  for (const [i, file] of files.entries()) {
    btn.textContent = `Reading ${i + 1}/${files.length}…`;
    btn.disabled = true;
    const form = new FormData();
    form.append('image', file);
    try {
      const res = await fetch('/api/summarize-photo', {
        method: 'POST',
        headers: { authorization: `Bearer ${session.access_token}` },
        body: form,
      });
      const out = await res.json();
      if (out.text) {
        $('body').value += ($('body').value.trim() ? '\n\n' : '') + out.text;
      } else {
        $('editMsg').textContent = out.error || 'Could not read a photo.';
      }
    } catch {
      $('editMsg').textContent = 'Could not read a photo.';
    }
  }
  btn.textContent = label;
  btn.disabled = false;
};

// ---- ask the chapter ----
// One question about the chapter on screen, answered from that chapter's notes by /api/ask.
$('ask').onsubmit = async e => {
  e.preventDefault();
  const question = $('askQ').value.trim();
  const ch = chapters(current?.content || '')[listen?.player.ch ?? 0];
  if (!question || !ch) return;
  const { data: { session } } = await db.auth.getSession();
  $('askA').textContent = 'Thinking…';
  try {
    const res = await fetch('/api/ask', { method: 'POST', headers: { 'content-type': 'application/json', authorization: `Bearer ${session.access_token}` }, body: JSON.stringify({ text: ch.text, title: `${current.title}, ${ch.title}`, question }) });
    const out = await res.json();
    $('askA').textContent = out.answer || out.error || 'Could not answer that right now.';
  } catch { $('askA').textContent = 'Could not answer that right now.'; }
};

// ---- listen ----
// The player lives in listen.js (shared with share.html). This page only supplies the
// row: content, cached scripts, the resume point, and where to save them.
let listen = null;
// Natural voice for one line through /api/speak (ElevenLabs, cached per line on the server).
async function speak(text, host, ch) {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return null;
  const res = await fetch('/api/speak', { method: 'POST', headers: { 'content-type': 'application/json', authorization: `Bearer ${session.access_token}` }, body: JSON.stringify({ text, host, ch }) });
  if (res.status === 402) $('unlock').hidden = false;   // not paid: device voice plays, offer the $1
  return res.ok ? res.json() : null;
}
async function unlockVoices() {
  const { data: { session } } = await db.auth.getSession();
  const res = await fetch('/api/pay', { method: 'POST', headers: { authorization: `Bearer ${session.access_token}` } });
  const out = await res.json().catch(() => ({}));
  if (out.url) location.href = out.url; else $('unlock').textContent = out.error || 'Checkout did not open.';
}
async function narrate(ch, text, title, total) {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return null;
  try {
    const res = await fetch('/api/narrate', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ text, title: `${$('title').value}, ${title}`, ch, total }),
    });
    return (await res.json()).script || null;
  } catch { return null; }
}
function mountListen() {
  listen?.stop();
  if (!current) { $('listen').innerHTML = ''; return; }
  const st = current.listen?.for === current.updated_at ? current.listen : null;
  listen = mount($('listen'), {
    title: current.title, content: current.content, scripts: st?.chapters, pos: st?.pos, narrate, speak,
    marks: current.listen?.marks || [],   // kept even when listen.for is stale: a saved line is its text
    voices: () => speechSynthesis.getVoices(),
    save: (pos, chapters, marks) => {
      if (!current) return;
      current.listen = { for: current.updated_at, chapters, pos, marks: marks ?? current.listen?.marks ?? [] };
      db.from(TABLE).update({ listen: current.listen, updated_at: current.updated_at }).eq('id', current.id).then(() => {});  // keep updated_at, or listen.for stops matching
    },
  });
}

// ---- thumbnails ----
// Order: the row's saved cover, books.json by fuzzy title, then Open Library: a title
// search, then a general search, each yielding work/ISBN/edition image candidates that are
// probed by actually loading them. The first hit is written to the row's `cover` column so
// it is found once, for every device and the apps. A miss is retried next visit, never cached.
const books = fetch('books.json').then(r => r.json()).catch(() => []);
const loads = url => new Promise(res => { const i = new Image(); i.onload = () => res(url); i.onerror = () => res(null); i.src = url; });
async function firstLoadable(urls) { for (const u of urls) if (await loads(u)) return u; return null; }
async function olCandidates(title) {
  const out = [];
  for (const param of ['title', 'q']) {
    try {
      const r = await fetch(`https://openlibrary.org/search.json?${param}=${encodeURIComponent(title)}&limit=2&fields=cover_i,isbn,edition_key`);
      for (const d of (await r.json()).docs || []) out.push(...coverCandidates(d));
    } catch {}
  }
  // Last resort: Google Books. Its unauthenticated quota is per client, so the browser
  // usually has it even when a server would not.
  try {
    const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=intitle:${encodeURIComponent(title)}&maxResults=3&fields=items(volumeInfo(imageLinks))`);
    for (const it of (await r.json()).items || []) { const t = it.volumeInfo?.imageLinks?.thumbnail; if (t) out.push(t.replace(/^http:/, 'https:')); }
  } catch {}
  return [...new Set(out)];
}
async function resolveCover(row) {
  if (row.cover) return row.cover;
  const u = matchCover(row.title, await books) || await firstLoadable(await olCandidates(row.title));
  if (u) { row.cover = u; db.from(TABLE).update({ cover: u, updated_at: row.updated_at }).eq('id', row.id).then(() => {}); }
  return u;
}
function thumb(row) {
  const img = Object.assign(document.createElement('img'), { className: 'thumb', alt: '', loading: 'lazy' });
  resolveCover(row).then(u => { if (u) img.src = u; else img.className = 'thumb-empty'; });
  return img;
}

// ---- share ----
// A share token is a public, unguessable URL to this summary's text and audio, nothing
// else: no position, no account. Stop sharing clears it and the old link dies.
$('share').onclick = async () => {
  if (!current) { $('editMsg').textContent = 'Save first.'; return; }
  if (current.share_token) {
    if (!confirm('Stop sharing? The link stops working.')) return;
    const { error } = await rows.update(current.id, { share_token: null, updated_at: current.updated_at });
    if (error) { $('editMsg').textContent = error.message; return; }
    current.share_token = null; $('share').textContent = 'Share'; $('editMsg').textContent = 'Link removed.';
    return;
  }
  const { data, error } = await rows.update(current.id, { share_token: crypto.randomUUID().replace(/-/g, ''), updated_at: current.updated_at });
  if (error) { $('editMsg').textContent = error.message; return; }
  current.share_token = data.share_token;
  const url = shareUrl(location.origin, data.share_token);
  try { await navigator.clipboard.writeText(url); $('editMsg').textContent = 'Link copied: ' + url; }
  catch { $('editMsg').textContent = url; }
  $('share').textContent = 'Stop sharing';
};

// ---- data layer ----
// Every query lives here exactly once. The UI functions below render it; the
// WebMCP bridge at the bottom calls it directly. That split is deliberate: a
// tool must be able to read and write summaries WITHOUT disturbing whatever the
// user has open in the editor, so no tool goes through open()/saveCurrent().
// Read-through cache in Cache Storage, keyed by account: every list and every summary you open is kept, so
// they stay readable offline (a flaky train is the point). Cleared on sign-out so the next account never sees it.
const offline = {
  key: async k => `/_rows/${(await db.auth.getSession()).data.session?.user.id || 'anon'}/${k}`,
  put: async (k, v) => { try { (await caches.open('bookrank-data')).put(await offline.key(k), new Response(JSON.stringify(v))); } catch {} },
  get: async k => { try { const r = await (await caches.open('bookrank-data')).match(await offline.key(k)); return r ? r.json() : null; } catch { return null; } },
};
const cached = async (k, q) => {
  const res = await q();
  if (!res.error) { offline.put(k, res.data); return res; }
  const hit = await offline.get(k);
  return hit ? { data: hit, error: null, offline: true } : res;
};
const rows = {
  list:   ()            => cached('list', () => db.from(TABLE).select('id,slug,title,updated_at,listen,cover,share_token').order('updated_at', { ascending: false })),
  get:    (id)          => cached(id, () => db.from(TABLE).select('*').eq('id', id).single()),
  insert: (row)         => db.from(TABLE).insert(row).select().single(),
  update: (id, row)     => db.from(TABLE).update(row).eq('id', id).select().single(),
  remove: (id)          => db.from(TABLE).delete().eq('id', id),
};

const stamp = (title, body, slug) => ({
  slug: slug || slugify(title),
  title,
  content: body,
  updated_at: new Date().toISOString(),
});

// ---- list ----
async function load() {
  listen?.stop();
  const { data, error, offline: off } = await rows.list();
  if (error) { $('listMsg').textContent = error.message; return []; }
  $('list').innerHTML = '';
  $('listMsg').textContent = off ? 'Offline. Showing your last copy.' : data.length ? '' : 'No summaries yet.';
  // Rows with a live resume point come first under "Currently playing"; the untouched
  // shelf follows. Progress lives on the row (`listen.pos`), so this survives devices.
  const started = r => r.listen?.for === r.updated_at && r.listen.pos && (r.listen.pos.ch || r.listen.pos.line);
  const groups = [['Currently playing', data.filter(started)], [data.some(started) ? 'Library' : '', data.filter(r => !started(r))]];
  for (const [label, rows] of groups) {
    if (!rows.length) continue;
    if (label) $('list').append(Object.assign(document.createElement('li'), { className: 'group', textContent: label }));
    for (const row of rows) {
    const li = document.createElement('li');
    li.dataset.id = row.id;
    const a = document.createElement('a');
    a.href = '#';
    a.onclick = e => { e.preventDefault(); open(row.id); };
    const name = Object.assign(document.createElement('span'), { textContent: row.title });
    const pos = row.listen?.for === row.updated_at && row.listen.pos;
    if (pos && (pos.ch || pos.line)) name.append(Object.assign(document.createElement('span'), { className: 'resume', textContent: `Ch ${pos.ch + 1}` }));
    a.append(name);
    a.append(Object.assign(document.createElement('time'), { textContent: row.updated_at.slice(0,10) }));
    const listenBtn = Object.assign(document.createElement('button'),
      { className: 'listen', textContent: 'Listen', title: 'Listen to ' + row.title });
    listenBtn.onclick = async () => { if (await open(row.id)) listen.player.play(); };
    li.append(thumb(row), a, listenBtn);
    $('list').append(li);
    }
  }
  // Search by title or by anything in the text. Appears once the list is long enough to need it.
  // The list rows skip the text to stay light; the first keystroke fetches it once, then search is local.
  $('find').classList.toggle('hide', data.length < 6);
  let texts = null;
  $('find').oninput = async () => {
    const q = $('find').value.trim().toLowerCase();
    if (q && !texts) {
      texts = {};
      const { data: full } = await db.from(TABLE).select('id,content');
      for (const r of full || []) texts[r.id] = (r.content || '').toLowerCase();
      if ($('find').value.trim().toLowerCase() !== q) return; // a newer keystroke took over
    }
    const hit = new Set(data.filter(r => !q || r.title.toLowerCase().includes(q) || (texts?.[r.id] || '').includes(q)).map(r => r.id));
    let shown = 0;
    for (const li of $('list').children) {
      if (li.classList.contains('group')) continue;
      const on = !q || hit.has(li.dataset.id); li.classList.toggle('hide', !on); shown += on;
    }
    for (const g of $('list').querySelectorAll('li.group')) g.classList.toggle('hide', !!q);
    for (const d of document.querySelectorAll('details.gr')) {
      let n = 0;
      for (const li of d.querySelectorAll('li')) { const on = !q || li.dataset.text.includes(q); li.classList.toggle('hide', !on); n += on; }
      d.classList.toggle('hide', !n); if (q && n) d.open = true; shown += n;
    }
    $('listMsg').textContent = q && !shown ? `Nothing matches "${$('find').value.trim()}".` : (data.length ? '' : 'No summaries yet.');
  };
  if ($('find').value) $('find').oninput();
  goodreadsQueue(data);
  return data;
}

// ---- editor ----
async function open(id) {
  const { data, error } = await rows.get(id);
  if (error) { $('listMsg').textContent = error.message; return null; }
  current = data;
  $('title').value = data.title;
  $('body').value = data.content;
  $('share').textContent = data.share_token ? 'Stop sharing' : 'Share';
  showEditor(true);
  if (location.hash !== '#' + id) history.pushState(null, '', '#' + id);
  return data;
}
// The linked Goodreads shelves, under the summaries so the list itself stays simple. Linking
// happens on the profile page. Currently reading opens by default; the two long shelves stay
// folded. Read books come newest first with the rating and the month they were finished.
// ponytail: title match only (prefix either way, or one inside the other); a missed match
// shows a book here that already has a summary, which is harmless.
async function goodreadsQueue(data) {
  for (const d of document.querySelectorAll('details.gr')) d.remove();
  const gr = (await db.auth.getUser()).data.user?.user_metadata?.goodreads;
  if (!gr) return;
  const shelf = s => fetch(`/api/goodreads?user=${encodeURIComponent(gr)}&shelf=${s}`).then(r => r.json()).then(r => r.books || []).catch(() => []);
  const [reading, read, toRead] = await Promise.all(['currently-reading', 'read', 'to-read'].map(shelf));
  // A summary matches when its words all appear in the Goodreads title, or when the two match
  // with spaces removed ("Feng Shui" vs "Fengshui"). Extra words like "Science" or a subtitle are fine.
  const norm = s => s.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const have = data.map(d => norm(d.title)).filter(Boolean);
  const same = (h, t) => { const tw = new Set(t.split(' ')); return h.split(' ').every(w => tw.has(w)) || t.replace(/ /g, '').includes(h.replace(/ /g, '')); };
  const todo = read.filter(b => { const t = norm(b.title); return !have.some(h => same(h, t)); }).sort((a, b) => (b.readAt || '').localeCompare(a.readAt || ''));
  const month = d => d ? new Date(d + 'T00:00').toLocaleDateString(undefined, { month: 'short', year: 'numeric' }) : '';
  let anchor = $('list');
  for (const [label, books, open] of [['Currently reading', reading, true], ['Read on Goodreads, no summary yet', todo, false], ['Want to read', toRead, false]]) {
    if (!books.length) continue;
    const d = Object.assign(document.createElement('details'), { className: 'gr', open });
    d.append(Object.assign(document.createElement('summary'), { textContent: `${label} (${books.length})` }));
    const ul = Object.assign(document.createElement('ul'), { className: 'list' });
    for (const b of books) {
      const li = document.createElement('li');
      li.dataset.text = `${b.title} ${b.author}`.toLowerCase();
      const img = b.cover ? Object.assign(document.createElement('img'), { className: 'thumb', src: b.cover, alt: '', loading: 'lazy' }) : Object.assign(document.createElement('span'), { className: 'thumb-empty' });
      const a = Object.assign(document.createElement('a'), { href: b.url || '#', target: '_blank', rel: 'noopener' });
      const name = Object.assign(document.createElement('span'), { textContent: b.title });
      name.append(Object.assign(document.createElement('span'), { className: 'by', textContent: b.author }));
      a.append(name);
      const stars = r => '\u2605'.repeat(Math.floor(r)) + (r % 1 ? '\u00bd' : '') + '\u2606'.repeat(5 - Math.ceil(r));   // halves as ½
      const meta = [b.rating && stars(b.rating), month(b.readAt)].filter(Boolean).join(' · ');
      if (meta) a.append(Object.assign(document.createElement('time'), { textContent: meta, ariaLabel: [b.rating && `${b.rating} of 5 stars`, month(b.readAt)].filter(Boolean).join(', ') }));
      li.append(img, a); ul.append(li);
    }
    d.append(ul); anchor.after(d); anchor = d;
  }
  if (anchor !== $('list')) { $('find').classList.remove('hide'); if ($('find').value) $('find').oninput(); }
}
// ponytail: #<row id> is the route. Back/forward and reloads land on the same summary.
addEventListener('popstate', () => { const id = location.hash.slice(1); if (id && current?.id !== id) open(id); else if (!id && !$('editView').classList.contains('hide')) { show('listView'); load(); } });
function showEditor(reading = false) {
  $('editMsg').textContent = '';
  $('del').classList.toggle('hide', !current);
  show('editView');
  render(reading);
}
// Listen view (transcript + chapters) or the raw markdown editor.
function render(reading) {
  $('listen').classList.toggle('hide', !reading);
  $('ask').classList.toggle('hide', !reading); $('askA').textContent = '';
  $('body').classList.toggle('hide', reading);
  $('toggle').textContent = reading ? 'Edit' : 'Listen';
  $('share').classList.toggle('hide', !reading);
  if (reading) mountListen(); else listen?.stop();
}
$('new').onclick = () => { current = null; $('title').value = ''; $('body').value = ''; showEditor(false); };
$('close').onclick = () => { if (location.hash) history.pushState(null, '', location.pathname); show('listView'); load(); };
$('toggle').onclick = () => { if (!current && !$('body').classList.contains('hide')) { $('editMsg').textContent = 'Save first.'; return; } render(!$('body').classList.contains('hide')); };
// Saves whatever is in the editor. Editor-only -- tools never call this.
async function saveCurrent() {
  const title = $('title').value.trim();
  if (!title) return { error: { message: 'Title required.' } };
  const row = stamp(title, $('body').value, current?.slug);
  // Same content re-saved keeps the scripts and position; the new stamp re-validates them.
  if (current?.listen && current.content === $('body').value) row.listen = { ...current.listen, for: row.updated_at };
  const { data, error } = current ? await rows.update(current.id, row) : await rows.insert(row);
  if (!error && data) { current = data; $('share').textContent = data.share_token ? 'Stop sharing' : 'Share'; }
  return { data, error };
}
$('save').onclick = async () => {
  // Whether this was a new summary decides if we return to the list, so read it
  // before saveCurrent() assigns `current` from the inserted row.
  const isNew = !current;
  const { error } = await saveCurrent();
  $('editMsg').textContent = error ? error.message : 'Saved.';
  if (!error) render(true);
};

$('del').onclick = async () => {
  if (!current || !confirm('Delete "' + current.title + '"? This cannot be undone.')) return;
  const { error } = await rows.remove(current.id);
  if (error) { $('editMsg').textContent = error.message; return; }
  show('listView'); load();
};

// ---- WebMCP bridge ----
// ponytail: exposes the data layer, not the UI functions. Same db client and
// same table the UI uses, but a tool call cannot null out `current`, overwrite
// the open textareas, or navigate the user somewhere they did not ask to go.
window.__kernel = {
  rows,
  stamp,
  whoami: async () => (await db.auth.getUser()).data.user,
  // Re-render the list only when the user is actually looking at it, so a tool
  // write shows up without yanking anyone out of the editor.
  refreshList: () => { if (!$('listView').classList.contains('hide')) load(); },
};
</script>
<script type="module" src="webmcp.js"></script>
  <script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));</script>
</body>
</html>
